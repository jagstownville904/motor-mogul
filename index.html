<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Motor Mogul v0.2 — Jacksonville 1975</title><style>
:root{font-family:Georgia,'Times New Roman',serif;color:#302a21;background:#eae0ca}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{background:#faf3dc;border:1px solid #92795b;border-radius:5px;padding:10px 12px;color:#392d20;cursor:pointer}button:disabled{opacity:.42;cursor:not-allowed}.primary{background:#245447;color:white}.danger{background:#833e32;color:white}.bar{background:#303c37;color:#faf0d5;padding:15px}.brand{font:bold 29px Georgia;letter-spacing:.08em}.brand span{color:#d59a62}.small{font-size:12px;color:#796b5c}.bar .small{color:#e3cc9b}main{max-width:1100px;margin:auto;padding:12px 13px 70px}.top{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px;margin:10px 0}.stat,.card,.panel,.notice{background:#fffaf0;border:1px solid #cdbd9b;border-radius:6px;padding:12px}.stat strong{display:block;font-size:19px;margin-top:4px}.stat .small{font:11px system-ui;color:#6f6557}nav{display:flex;gap:6px;overflow:auto;padding:8px 0 13px}nav button{white-space:nowrap}.active{background:#6e4333;color:white}h1,h2,h3{margin:9px 0 12px}h2{font-size:23px}h3{font-size:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(265px,1fr));gap:10px}.row{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.stack{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.muted{color:#766b60}.red{color:#a03732}.green{color:#245e44}.notice{background:#fff0c8;margin-bottom:12px}input{padding:10px;border-radius:4px;border:1px solid #9e927c;max-width:100%;width:160px}.vehicle{background:#ded2b8;padding:10px;text-align:center;margin-bottom:9px}.vehicle .emoji{font-size:53px}.vehicle .small{display:block}.line{border-top:1px solid #d6c7af;margin:10px 0}.two{display:grid;grid-template-columns:1.4fr 1fr;gap:11px}.columns{columns:3 210px;column-gap:20px}.ad{display:block;break-inside:avoid;padding:7px 0;border-bottom:1px dashed #b2a48b;font-size:14px}.ad button{padding:3px 6px;font-size:12px}.label{display:inline-block;background:#e4d6b9;border-radius:3px;padding:3px 6px;font-size:12px}.repair{padding:12px 0;border-bottom:1px solid #e5d8c4}.money{font-weight:bold}.negative{color:#a33b31}.positive{color:#1e7153}.book{background:#f1e3bb;border:2px solid #bda475;padding:14px}.book h2{text-align:center;border-bottom:3px double #66543e;padding-bottom:10px}.call{padding:11px;border-left:4px solid #b48652;background:#f5eddb;margin:8px 0}table{border-collapse:collapse;width:100%}td,th{padding:8px;border-bottom:1px solid #e0d5c3;text-align:left}td:last-child,th:last-child{text-align:right}.pill{display:inline-block;background:#f0d6a2;padding:3px 7px;font-size:12px;border-radius:4px}footer{margin-top:20px;font-size:11px;color:#6d665a}.scroll{overflow-x:auto}@media(max-width:650px){.stats{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}.brand{font-size:23px}.stat strong{font-size:17px}.columns{columns:2 140px}}
</style></head><body><div class="bar"><div class="top"><div><div class="brand"><span>MOTOR</span> MOGUL</div><div class="small">From Backyard Deals to Dealership Empires · Jacksonville, Florida</div></div><div id="date"></div></div></div><main><div id="stats" class="stats"></div><nav id="nav"></nav><div id="flash"></div><div id="app"></div><footer>Motor Mogul v0.2 beta · Fictional vehicles and simulated 1975-style valuations, not authenticated historical price quotes. Progress stays in this browser. Export saves under Books.</footer></main><script>
(()=>{'use strict';
const KEY='motorMogul1975_v01', START='1975-10-11', systems=['Engine','Transmission','Body & Frame','Interior','Suspension & Brakes','Electrical'];
const catalog=[['1968','Chevrolet','Impala','Sedan',860,'🚙'],['1971','Plymouth','Duster','Coupe',1380,'🚗'],['1972','Pontiac','Firebird','Coupe',2240,'🏎️'],['1973','Dodge','Charger','Coupe',2350,'🏎️'],['1973','Chevrolet','Malibu','Coupe',2180,'🚗'],['1972','Ford','Pinto','Hatchback',780,'🚗'],['1969','Ford','F-100','Pickup',1100,'🛻'],['1971','Chevrolet','C10','Pickup',1430,'🛻'],['1973','Datsun','240Z','Coupe',2580,'🏎️'],['1972','Toyota','Corolla','Sedan',1190,'🚗'],['1970','Pontiac','LeMans','Coupe',1260,'🚗'],['1974','Ford','Maverick','Sedan',1720,'🚙'],['1971','AMC','Gremlin','Hatchback',990,'🚗'],['1970','Buick','Skylark','Sedan',1200,'🚙'],['1967','Volkswagen','Beetle','Sedan',730,'🚗'],['1973','Ford','Ranchero','Pickup',1610,'🛻'],['1970','Oldsmobile','Cutlass','Coupe',1470,'🚗'],['1974','Dodge','Dart','Sedan',1830,'🚙'],['1972','Chevrolet','Nova','Sedan',1330,'🚗'],['1969','Plymouth','Road Runner','Coupe',2020,'🏎️'],['1971','Ford','Mustang','Coupe',1900,'🏎️'],['1973','International','Scout II','SUV',2260,'🛻'],['1974','Honda','Civic','Hatchback',1900,'🚗'],['1970','Ford','Galaxie 500','Sedan',920,'🚙'],['1972','Chevrolet','El Camino','Utility',1720,'🛻'],['1971','Mercury','Montego','Sedan',1100,'🚙'],['1970','Chevrolet','Chevelle','Coupe',1800,'🏎️'],['1972','Ford','Country Squire','Wagon',1190,'🚙']];
const faults=[
 [{name:'Tune-up needed',cost:65,cap:'Good',severity:'optional'},{name:'Small oil seep',cost:80,cap:'Good',severity:'optional'},{name:'Cooling system needs service',cost:125,cap:'Fair',severity:'required'},{name:'Carburetor runs rough',cost:110,cap:'Fair',severity:'required'}],
 [{name:'Minor linkage adjustment',cost:55,cap:'Good',severity:'optional'},{name:'Fluid leak',cost:100,cap:'Fair',severity:'required'},{name:'Shifts hard',cost:170,cap:'Fair',severity:'required'},{name:'Clutch slips',cost:230,cap:'Fair',severity:'required'}],
 [{name:'Faded paint',cost:135,cap:'Good',severity:'optional'},{name:'Small dent',cost:105,cap:'Good',severity:'optional'},{name:'Surface rust on lower panels',cost:175,cap:'Fair',severity:'optional'},{name:'Structural rust',cost:500,cap:'Poor',severity:'required'}],
 [{name:'Worn carpet',cost:85,cap:'Good',severity:'optional'},{name:'Seat seam torn',cost:70,cap:'Good',severity:'optional'},{name:'Cracked dashboard',cost:130,cap:'Fair',severity:'optional'}],
 [{name:'Worn shocks',cost:120,cap:'Good',severity:'optional'},{name:'Steering play',cost:155,cap:'Fair',severity:'required'},{name:'Brakes need service',cost:135,cap:'Fair',severity:'required'}],
 [{name:'Weak battery',cost:65,cap:'Good',severity:'required'},{name:'Faulty alternator',cost:105,cap:'Fair',severity:'required'},{name:'Intermittent starter',cost:110,cap:'Fair',severity:'required'},{name:'Wiring fault',cost:180,cap:'Fair',severity:'required'}]
];
const names=['Linda','Ray','Martha','Frank','Harold','Betty','Earl','Carol','Wayne','Pat','Jim','Dennis'];
const rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a, pick=a=>a[rand(0,a.length-1)], round25=n=>Math.max(25,Math.round(n/25)*25), money=n=>'$'+Math.round(n||0).toLocaleString('en-US'), clamp=(n,a,b)=>Math.max(a,Math.min(b,n)), esc=s=>String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
function level(n){return n<30?'Poor':n<49?'Fair':n<67?'Good':n<84?'Very Good':'Excellent'}
const rank={'Poor':0,'Fair':1,'Good':2,'Very Good':3,'Excellent':4};
function normalized(r,i){if(r.fault===undefined){let match=faults[i].find(f=>(r.issue||'').toLowerCase().includes(f.name.toLowerCase().substring(0,9)));if(!match){match=faults[i].find(f=>f.name.toLowerCase().includes((r.issue||'').toLowerCase().substring(0,7)))||faults[i][0]}r.fault={...match};r.fault.cost=match.cost;}if(typeof r.repaired!=='boolean')r.repaired=false;return r}
function systemGrade(r){if(r.repaired||!r.fault)return level(r.health);return rank[level(r.health)]<=rank[r.fault.cap]?level(r.health):r.fault.cap}
function effective(c){return Math.round(c.repairs.reduce((s,r)=>s+([15,43,58,75,91][rank[systemGrade(r)]]),0)/6)}
function retail(c){let base=c.base||1200, mileage=clamp(1.10-((c.miles||80000)-50000)/420000,.77,1.12);return round25(base*[.49,.67,.86,1.16,1.35][rank[level(effective(c))]]*mileage)}
function guide(c){return ['Poor','Fair','Good','Very Good','Excellent'].map((name,i)=>({name,retail:round25(c.base*[.49,.67,.86,1.16,1.35][i]*clamp(1.1-((c.miles||80000)-50000)/420000,.77,1.12))}))}
function newCar(source='paper'){const m=pick(catalog),condition=rand(42,87),repairs=systems.map((_,i)=>{const health=clamp(condition+rand(-18,18),15,98),chance=health>75?.19:health>58?.34:.55;return {name:systems[i],health,fault:Math.random()<chance?{...pick(faults[i])}:null,repaired:false}});let c={id:'v'+Date.now()+rand(10000,999999),year:+m[0],make:m[1],model:m[2],body:m[3],base:m[4],emoji:m[5],miles:rand(37,152)*1000,repairs,name:pick(names),known:[],source,listedDay:state?.day||0,visitDay:-1,offerRounds:0,finalOffer:null,negStatus:'',patience:rand(2,3),expenses:[],cost:0,saleAsking:0,buyerWait:0};let value=retail(c);c.ask=round25(value*rand(82,118)/100);c.minimum=round25(value*rand(68,91)/100);c.minimum=Math.min(c.minimum,c.ask);return c}
let state=null,tab='paper',selected=null,page=0,flash='';
function fresh(){let s={version:1,day:0,cash:5000,inventory:[],ads:[],magazine:[],magWeek:0,history:[],ledger:[],realized:0,flips:0,log:[],totalRepairs:0};state=s;for(let i=0;i<22;i++)s.ads.push(newCar());for(let i=0;i<30;i++)s.magazine.push(newCar('magazine'));return s}
function migrate(s){s.inventory||=[];s.ads||=[];s.ledger||=[];s.history||=[];s.log||=[];s.day||=0;s.realized||=0;s.flips||=s.history.filter(h=>h.sold).length;s.magazine||=[];s.magWeek??=Math.floor(s.day/7);for(const c of [...s.inventory,...s.ads,...s.magazine]){c.known||=[];c.expenses||=[];c.source||='paper';c.offerRounds??=0;c.visitDay??=-1;c.finalOffer??=null;c.negStatus||='';c.repairs?.forEach(normalized);if(c.inspectionSpent===undefined)c.inspectionSpent=0}if(!s.magazine.length){state=s;for(let i=0;i<30;i++)s.magazine.push(newCar('magazine'))}return s}
try{const saved=JSON.parse(localStorage.getItem(KEY));state=saved&&saved.version===1?migrate(saved):fresh()}catch(e){state=fresh()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}function log(type,amount,memo){state.ledger.unshift({day:state.day,kind:type,amount,memo});state.ledger=state.ledger.slice(0,400)}
function title(c){return `${c.year} ${c.make} ${c.model}`}function findCar(id){return [...state.ads,...state.magazine,...state.inventory].find(c=>c.id===id)}function owns(c){return state.inventory.some(x=>x.id===c.id)}function adList(c){return c.source==='magazine'?state.magazine:state.ads}
function date(){let d=new Date(START+'T12:00:00');d.setDate(d.getDate()+state.day);return d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric',year:'numeric'})}
function b(t,action,cls='',other=''){return `<button class="${cls}" data-action="${action}" ${other}>${t}</button>`}function alert(m){flash=m;render()}function show(t,id){tab=t;selected=id||null;flash='';render()}
function header(){document.getElementById('date').textContent=date();let invCost=state.inventory.reduce((sum,c)=>sum+(c.cost||0)+(c.expenses||[]).reduce((n,e)=>n+e.cost,0),0),capacity=state.flips>=10?4:state.flips>=5?3:2;document.getElementById('stats').innerHTML=[['CASH',money(state.cash)],['GARAGE',state.inventory.length+'/'+capacity],['NET WORTH AT COST',money(state.cash+invCost)],['REALIZED PROFIT',money(state.realized)],['COMPLETED FLIPS',state.flips]].map(([a,v])=>`<div class="stat"><div class="small">${a}</div><strong>${v}</strong></div>`).join('');document.getElementById('nav').innerHTML=[['paper','📰 Classifieds'],['magazine','📖 Auto Trader'],['garage','🚗 Garage'],['guide','📊 Price Guide'],['books','📒 Books'],['rules','❔ Rules']].map(([key,label])=>`<button data-tab="${key}" class="${tab===key?'active':''}">${label}</button>`).join('')+b('Advance Day →','advance','primary');document.getElementById('flash').innerHTML=flash?`<div class="notice">${esc(flash)}</div>`:''}
function adCard(c,mag=false){return `<div class="${mag?'card':'ad'}">${mag?`<div class="vehicle"><span class="emoji">${c.emoji}</span><span class="small">${esc(c.body)} · ${c.miles.toLocaleString()} miles</span></div>`:''}<strong>${esc(title(c))}</strong> — ${money(c.ask)}<div class="small">${c.miles.toLocaleString()} miles · Seller: ${esc(c.name)}</div>${b('View & inspect','car:'+c.id)} ${c.visitDay===state.day?'<span class="pill">Negotiated today</span>':''}</div>`}
function paper(){return `<div class="book"><h2>THE JACKSONVILLE DAILY NEWS</h2><div class="row"><span>Automobiles for Sale · Local Classifieds</span><span>${date()}</span></div><div class="line"></div><div class="columns">${state.ads.map(c=>adCard(c)).join('')}</div></div>`}
function magazine(){let total=Math.max(1,Math.ceil(state.magazine.length/6));page=clamp(page,0,total-1);return `<div class="book"><h2>AUTO TRADER · WEEKLY EDITION</h2><div class="row"><span>Issue ${state.magWeek+1} · ${state.magazine.length} advertisements</span><span>Page ${page+1} of ${total}</span></div><div class="grid">${state.magazine.slice(page*6,page*6+6).map(c=>adCard(c,true)).join('')}</div><div class="line"></div><div class="row">${b('← Previous Page','prev','',page===0?'disabled':'')} ${b('Next Page →','next','',page>=total-1?'disabled':'')}</div></div>`}
function fees(c){return c.inspectionSpent||0}function repairSum(c){return c.repairs.reduce((v,r,i)=>v+(c.known.includes(i)&&r.fault&&!r.repaired?r.fault.cost:0),0)}function necessary(c){return c.repairs.reduce((v,r,i)=>v+(c.known.includes(i)&&r.fault&&!r.repaired&&r.fault.severity==='required'?r.fault.cost:0),0)}
function inspection(c){return `<div class="panel"><h3>Mechanic's Inspection</h3><div class="small">$25 each · $100 maximum per vehicle · Findings remain in your notebook.</div><div class="grid">${c.repairs.map((r,i)=>`<div class="card"><div class="row"><strong>${systems[i]}</strong><span class="pill">${c.known.includes(i)?systemGrade(r):'Not inspected'}</span></div>${c.known.includes(i)?`<p>${r.fault&&!r.repaired?esc(r.fault.name):r.repaired?'Repaired / serviced':'No immediate defect discovered'}</p><div class="small">${r.fault&&!r.repaired?`${r.fault.severity==='required'?'Safety/reliability':'Optional'} · Estimate ${money(r.fault.cost)}`:'Estimated repair $0'}</div>`:'<p class="muted">Condition unknown</p>'}<div class="stack">${b(c.known.includes(i)?'Inspected':'Inspect — '+money(Math.min(25,100-fees(c))),'inspect:'+i,'',c.known.includes(i)||owns(c)||state.cash<Math.min(25,100-fees(c))?'disabled':'')}${owns(c)&&r.fault&&!r.repaired?b('Repair '+money(r.fault.cost),'repair:'+i,'primary',state.cash<r.fault.cost?'disabled':''):''}</div></div>`).join('')}</div><div class="line"></div><div class="row"><div><strong>Rolling repair estimate: ${money(repairSum(c))}</strong><div class="small">Essential work: ${money(necessary(c))} · Optional: ${money(repairSum(c)-necessary(c))}</div></div><div><strong>Inspection fees paid: ${money(fees(c))}</strong><div class="small">Next inspection: ${money(Math.min(25,Math.max(0,100-fees(c))))}</div></div></div></div>`}
function negotiation(c){if(owns(c))return '';let locked=c.visitDay===state.day&&c.negStatus==='walked';let status=c.negStatus==='final';return `<div class="panel"><h3>Negotiate with ${esc(c.name)}</h3><div class="row"><span>Seller asks <strong>${money(c.ask)}</strong></span><span>Seller's last price <strong>${money(c.finalOffer??c.ask)}</strong></span></div>${c.visitDay===state.day?`<div class="call">${c.negStatus==='final'?`“This is my final price: ${money(c.finalOffer)}. Take it or leave it.”`:c.negStatus==='walked'?'You already negotiated with this seller today. Come back tomorrow if the vehicle is still available.':c.negStatus==='accepted'?'Deal completed.':c.lastMessage||'Seller is listening.'}</div>`:''}${locked?`<p class="muted">Negotiations closed for today.</p>`:status?`<div class="stack">${b('Accept final offer — '+money(c.finalOffer),'acceptfinal','primary',state.cash<c.finalOffer?'disabled':'')}${b('Walk Away','walk','danger')}</div>`:`<div class="small">${c.visitDay===state.day?`Round ${c.offerRounds} of 3`:'First visit today · Up to 3 offers'}. Your offer is entirely up to you.</div><div class="stack"><input id="offer" inputmode="numeric" type="number" min="1" placeholder="Enter your offer">${b('Submit Offer','offer','primary')}${b('Pay Asking Price','buyask','',state.cash<c.ask?'disabled':'')}${b('Walk Away','walk','danger')}</div>`}<p class="small">Seller remembers prior visits. One negotiation visit per vehicle per day, even if advertised in multiple places.</p></div>`}
function car(){let c=findCar(selected);if(!c)return '<p>Vehicle not available.</p>';let owner=owns(c),estimate=retail(c),invest=(c.cost||0)+c.expenses.reduce((s,e)=>s+e.cost,0);return `<div class="row"><h2>${esc(title(c))}</h2>${b('← '+(owner?'Garage':c.source==='magazine'?'Auto Trader':'Classifieds'),'back')}</div><div class="two"><div><div class="card"><div class="vehicle"><span class="emoji">${c.emoji}</span></div><div class="row"><strong>${c.miles.toLocaleString()} miles · ${esc(c.body)}</strong><span class="pill">${owner?'Owned':esc(c.name)+' asks '+money(c.ask)}</span></div><div class="line"></div><div>Condition estimate: <strong>${level(effective(c))}</strong> · Guide retail estimate: <strong>${money(estimate)}</strong></div><div class="small">Estimates assume condition information currently recorded; undiscovered defects may affect value.</div>${owner?`<p>Total recorded investment: <strong>${money(invest)}</strong> · Potential spread at guide retail: <strong class="${estimate-invest>=0?'positive':'negative'}">${money(estimate-invest)}</strong></p>`:''}</div>${inspection(c)}${owner?listing(c):negotiation(c)}</div><div><div class="panel"><h3>1975 Price Guide</h3><table><tr><th>Condition</th><th>Retail estimate</th></tr>${guide(c).map(g=>`<tr><td>${g.name}</td><td>${money(g.retail)}</td></tr>`).join('')}</table><p class="small">Resale depends on buyer interest, location, and undisclosed faults. The guide is not a guaranteed sale.</p></div><div class="panel"><h3>Deal Notebook</h3><div class="small">Visit: ${c.visitDay===state.day?'Today':c.visitDay>=0?'Previously':'Not yet negotiated'} · Inspected ${c.known.length}/6 systems</div><p>Inspection expense already paid: ${money(fees(c))}</p><p>Open repair estimates: ${money(repairSum(c))}</p>${c.visitDay>=0?`<p>Last seller response: ${esc(c.lastMessage||'No response recorded')}</p>`:''}</div></div></div>`}
function listing(c){return `<div class="panel"><h3>Advertise & Sell</h3><p class="small">Choose your asking price. Advancing the day may bring a buyer offer. You can also sell as-is; known faults remain disclosed.</p><div class="stack"><input id="asking" type="number" min="1" placeholder="Your asking price" value="${c.saleAsking||retail(c)}">${b(c.saleAsking?'Update Listing':'Advertise Car','list','primary')}</div>${c.saleAsking?`<p>Currently advertised for <strong>${money(c.saleAsking)}</strong></p>${c.buyerOffer?`<div class="call">Buyer offer: <strong>${money(c.buyerOffer)}</strong>. ${c.buyerName||'A local buyer'} is ready to buy as-is.</div><div class="stack">${b('Accept Buyer Offer','sell','primary')}${b('Reject Offer','reject')}</div>`:'<p class="muted">No active buyer offer. Check after advancing a day.</p>'}`:''}</div>`}
function garage(){return `<h2>My Garage</h2><div class="grid">${state.inventory.map(c=>`<div class="card"><div class="vehicle"><span class="emoji">${c.emoji}</span></div><h3>${esc(title(c))}</h3><p>Purchase: ${money(c.cost)} · Estimated resale: ${money(retail(c))}</p><p class="small">${c.saleAsking?'Listed: '+money(c.saleAsking):'Not advertised'} · Repair spending: ${money(c.expenses.reduce((a,x)=>a+x.cost,0))}</p>${b('Manage Car','car:'+c.id,'primary')}</div>`).join('')||'<div class="card">Your garage is empty. Go hunting in the Classifieds or Auto Trader.</div>'}</div>`}
function priceGuide(){return `<h2>Price Guide</h2><p>Simulated 1975 baseline retail estimates for ordinary, roadworthy examples. Vehicle condition and mileage change actual estimates.</p><div class="grid">${catalog.map(m=>`<div class="card"><strong>${m[0]} ${m[1]} ${m[2]}</strong><p>Reference base: ${money(m[4])}</p></div>`).join('')}</div>`}
function books(){return `<h2>Deal Ledger</h2><div class="panel"><div class="row"><strong>Completed flips: ${state.flips}</strong>${b('Export Save File','export')}</div><p>Cash: ${money(state.cash)} · Realized profit: ${money(state.realized)} · Garage value at recorded cost is included in net worth.</p><div class="scroll"><table><tr><th>Day</th><th>Event</th><th>Cash movement</th></tr>${state.ledger.map(e=>`<tr><td>${esc(e.day)}</td><td>${esc(e.memo||e.kind)}</td><td class="${e.amount<0?'negative':'positive'}">${e.amount<0?'−':'+'}${money(Math.abs(e.amount))}</td></tr>`).join('')}</table></div></div>`}
function rules(){return `<h2>Motor Mogul Rules · v0.2</h2><div class="panel"><p>Inspect six systems at $25 per system, capped at $100 total per vehicle. Inspections reveal faults and provide repair estimates. A defect can cap a system's condition grade.</p><p>Negotiate at most three rounds per vehicle per day. The third unsuccessful offer triggers a final firm seller quote: accept it or walk away. Walking away prevents repeat negotiations that day.</p><p>Repair only what makes financial sense, while accounting for critical safety and reliability faults. List owned cars and advance days to attract buyers. Buyer prices and timing are not guaranteed.</p><p>Garage grows from two spaces to three after five flips and four after ten flips. Dealer licensing and wholesale auctions are planned milestones, not yet implemented.</p><p>The magazine refreshes every seven days; individual vehicles may remain. Ads can disappear when others buy them.</p></div>`}
function returnTo(c){show(c.source==='magazine'?'magazine':'paper')}
function purchase(c,price){let cap=state.flips>=10?4:state.flips>=5?3:2;if(state.inventory.length>=cap)return alert('Garage is full. Sell a car first.');if(state.cash<price)return alert('Not enough available cash.');state.cash-=price;c.cost=price;c.expenses=[];c.saleAsking=0;c.buyerOffer=0;c.negStatus='accepted';state.ads=state.ads.filter(x=>x.id!==c.id);state.magazine=state.magazine.filter(x=>x.id!==c.id);state.inventory.push(c);log('purchase',-price,'Bought '+title(c));save();selected=c.id;tab='car';alert(`Purchased ${title(c)} for ${money(price)}. It is now in your garage.`)}
function advance(){state.day++;for(let c of [...state.ads,...state.magazine]){if(Math.random()<.055){state.ads=state.ads.filter(x=>x.id!==c.id);state.magazine=state.magazine.filter(x=>x.id!==c.id)}else if(Math.random()<.12)c.ask=round25(c.ask*.96)}while(state.ads.length<22)state.ads.push(newCar('paper'));if(Math.floor(state.day/7)>state.magWeek){state.magWeek=Math.floor(state.day/7);state.magazine=state.magazine.filter(()=>Math.random()<.48);while(state.magazine.length<30)state.magazine.push(newCar('magazine'));page=0}let messages=[];for(let c of state.inventory){if(!c.saleAsking)continue;if(c.buyerOffer)continue;let ratio=c.saleAsking/retail(c),prob=ratio<.9?.78:ratio<1.1?.46:ratio<1.3?.18:.06;if(Math.random()<prob){c.buyerOffer=round25(Math.min(c.saleAsking,c.saleAsking*rand(79,100)/100));c.buyerName=pick(names);messages.push(`${c.buyerName} offered ${money(c.buyerOffer)} for your ${title(c)}.`)}}for(let c of [...state.ads,...state.magazine])if(c.visitDay>=0&&c.negStatus==='walked'&&state.day>c.visitDay&&Math.random()<.1){c.ask=round25(c.ask*.95);messages.push(`${c.name} lowered the asking price on the ${title(c)} to ${money(c.ask)}.`)}save();alert(messages.length?messages.join(' '):'New day. The marketplace has changed; check listings and any advertised cars.')}
function click(action){if(action==='advance')return advance();if(action==='prev'){page--;return render()}if(action==='next'){page++;return render()}if(action==='back'){let c=findCar(selected);return show(!c?'paper':owns(c)?'garage':c.source==='magazine'?'magazine':'paper')}if(action==='export'){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='motor-mogul-save-day-'+state.day+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1500);return}if(action.startsWith('car:'))return show('car',action.slice(4));let c=findCar(selected);if(!c)return;if(action.startsWith('inspect:')){let i=+action.split(':')[1];if(c.known.includes(i))return;let fee=Math.min(25,Math.max(0,100-fees(c)));if(state.cash<fee)return alert('Not enough cash to pay the mechanic.');state.cash-=fee;c.inspectionSpent=fees(c)+fee;c.known.push(i);log('inspection',-fee,'Inspection '+systems[i]+' — '+title(c));save();return alert(`Inspected ${systems[i]}. Total inspection fees: ${money(fees(c))}. Open estimated repairs: ${money(repairSum(c))}.`)}if(action.startsWith('repair:')){let i=+action.split(':')[1],r=c.repairs[i];if(!owns(c)||!r.fault||r.repaired)return;let cost=r.fault.cost;if(state.cash<cost)return alert('Not enough cash for this repair.');state.cash-=cost;r.repaired=true;c.expenses.push({name:systems[i]+' — '+r.fault.name,cost});log('repair',-cost,'Repaired '+systems[i]+' — '+title(c));save();return alert(`Repair completed for ${money(cost)}. Condition and resale estimate updated.`)}if(action==='walk'){c.visitDay=state.day;c.negStatus='walked';c.lastMessage='You walked away from the deal.';save();return returnTo(c)}if(action==='buyask')return purchase(c,c.ask);if(action==='acceptfinal'){if(c.negStatus!=='final')return;return purchase(c,c.finalOffer)}if(action==='offer'){if(c.visitDay===state.day&&(c.negStatus==='walked'||c.negStatus==='final'))return alert('This negotiation is closed for today.');let offer=Number(document.getElementById('offer')?.value);if(!Number.isFinite(offer)||offer<=0)return alert('Enter a valid offer.');if(c.visitDay!==state.day){c.visitDay=state.day;c.offerRounds=0;c.negStatus='open'}c.offerRounds++;if(offer>=c.minimum&&Math.random()<(.65+(offer-c.minimum)/Math.max(100,c.ask)*.25)){return purchase(c,Math.min(offer,c.ask))}let previous=c.finalOffer||c.ask;c.finalOffer=round25(Math.max(c.minimum,Math.min(previous-25,Math.max(offer+25,(previous+offer)/2))));c.finalOffer=Math.max(c.minimum,c.finalOffer);c.lastMessage=`“I can't do ${money(offer)}. ${money(c.finalOffer)} is what I can offer.”`;if(c.offerRounds>=3){c.negStatus='final';c.lastMessage=`“This is my final price: ${money(c.finalOffer)}. Take it or leave it.”`}save();return alert(c.lastMessage)}if(action==='list'){let price=Number(document.getElementById('asking')?.value);if(!Number.isFinite(price)||price<=0)return alert('Enter a valid asking price.');c.saleAsking=Math.round(price);c.buyerOffer=0;save();return alert(`Your ${title(c)} is advertised at ${money(price)}.`)}if(action==='reject'){c.buyerOffer=0;c.buyerWait=state.day;save();return alert('Offer rejected. Wait for another buyer.')}if(action==='sell'){if(!owns(c)||!c.buyerOffer)return;let sale=c.buyerOffer,spend=c.expenses.reduce((x,e)=>x+e.cost,0),profit=sale-c.cost-spend-fees(c);state.cash+=sale;state.realized+=profit;state.flips++;state.inventory=state.inventory.filter(x=>x.id!==c.id);state.history.unshift({vehicle:title(c),sold:true,buy:c.cost,sale,spend,inspection:fees(c),profit,day:state.day});log('sale',sale,'Sold '+title(c)+'; deal profit '+money(profit));save();selected=null;tab='garage';return alert(`SOLD for ${money(sale)}. Deal profit: ${money(profit)} after purchase, repairs and inspections.`)}}
function render(){header();document.getElementById('app').innerHTML=tab==='car'?car():tab==='paper'?paper():tab==='magazine'?magazine():tab==='garage'?garage():tab==='guide'?priceGuide():tab==='books'?books():rules()}
document.addEventListener('click',e=>{let el=e.target.closest('[data-action],[data-tab]');if(!el)return;if(el.dataset.tab){show(el.dataset.tab);return}click(el.dataset.action)});render();
})();
</script></body></html>
