function makeAuctionLane(a){let i=a.cursor,c=a.lots[i],max=a.bids[i]||0;const competition=round25(retail(c)*rand(40,96)/100),reserve=round25(retail(c)*rand(38,66)/100),required=Math.max(reserve,competition+25);const won=max>0&&required<=max;const hammer=won?round25(Math.max(125,required)):0;const start=round25(Math.max(125,Math.min(competition,reserve)*.65));const steps=[{speaker:'Auctioneer',line:'Who will start the bidding? Let me hear '+money(start)+'!',amount:start},{speaker:'Rival bidder',line:'I have '+money(round25(Math.max(start,competition*.8)))+' from the crowd!',amount:round25(Math.max(start,competition*.8))}];if(max>0){steps.push({speaker:'Your automatic bidder',line:'Your maximum is '+money(max)+'. Bidding stays within your limit.',amount:Math.min(max,round25(steps[1].amount+25))})}steps.push({speaker:won?'Auctioneer':'Rival bidder',line:won?'Going once, going twice…':'The bidding pushes beyond your maximum or fails to meet the reserve.',amount:won?hammer:required});a.lane={turn:0,steps,won,hammer,competition,reserve};}
function finishAuctionLot(a,skip=false){const i=a.cursor,c=a.lots[i],lane=a.lane;let result={lot:i+1,title:title(c),outcome:skip?'Skipped':'No bid'};if(!skip&&lane&&a.bids[i]>0){if(!lane.won)result.outcome='Outbid or reserve not met';else{let hammer=lane.hammer,fee=auctionFee(hammer);if(state.inventory.length>=garageCapacity()||state.cash<hammer+fee)result.outcome='Insufficient garage space or cash';else{state.cash-=hammer+fee;c.cost=hammer;c.inspectionSpent=0;c.expenses=[{name:'Auction buyer fee',cost:fee}];c.known=[];c.saleAsking=0;c.source='auction';state.inventory.push(c);log('purchase',-hammer,'Auction purchase '+title(c));log('auction fee',-fee,'Auction fee '+title(c));result={...result,outcome:'WON',hammer,fee}}}}a.results.push(result);delete a.bids[i];a.cursor++;a.lane=null;a.awaitNext=a.cursor<a.lots.length;if(a.cursor>=a.lots.length)a.closed=true;save();alert('Lot '+result.lot+': '+result.outcome+(result.hammer?' · Won for '+money(result.hammer)+' plus '+money(result.fee)+' fee.':''));}

function priceGuide(){return `<h2>Price Guide</h2><p>Simulated 1975 baseline retail estimates for ordinary, roadworthy examples. Vehicle condition and mileage change actual estimates.</p><div class="grid">${catalog.map(m=>`<div class="card"><strong>${m[0]} ${m[1]} ${m[2]}</strong><p>Reference base: ${money(m[4])}</p></div>`).join('')}</div>`}
function books(){return `<h2>Deal Ledger</h2><div class="panel"><div class="row"><strong>Completed flips: ${state.flips}</strong>${b('Export Save File','export')}</div><p>Cash: ${money(state.cash)} · Realized profit: ${money(state.realized)} · Home garage improvements: ${money(state.propertyInvestment||0)} (asset at cost). Vehicle inventory and home garage improvements are included in net worth at cost.</p><div class="scroll"><table><tr><th>Day</th><th>Event</th><th>Cash movement</th></tr>${state.ledger.map(e=>`<tr><td>${esc(e.day)}</td><td>${esc(e.memo||e.kind)}</td><td class="${e.amount<0?'negative':'positive'}">${e.amount<0?'−':'+'}${money(Math.abs(e.amount))}</td></tr>`).join('')}</table></div></div>`}
function rules(){return `<h2>Motor Mogul Rules · v0.3.9</h2><div class="panel"><p>Friday paychecks deposit $100 automatically beginning October 17, 1975. This is side income, separate from car-flipping profit.</p><p>Dealer-license eligibility unlocks at ten completed flips; obtaining the actual license and auction access will follow in a later update.</p><p>Inspect six systems at $25 per system, capped at $100 total per vehicle. Inspections reveal faults and provide repair estimates. A defect can cap a system's condition grade.</p><p>Seller and buyer offers are recorded in their conversation histories. Counteroffers can be rejected. A repaired defect restores the system's underlying condition, not necessarily the entire vehicle's grade.</p><p>Negotiations allow up to three rounds, but a buyer or seller may walk away earlier. Holding firm must not be described as raising an offer. Walking away prevents repeat negotiations that day.</p><p>Repair only what makes financial sense, while accounting for critical safety and reliability faults. List owned cars and advance days to attract buyers. Buyer prices and timing are not guaranteed.</p><p>Garage bay 3 unlocks after five flips and costs $500 to build. Bay 4 unlocks after ten flips and costs $750. Build from the Garage tab at any time. Construction is a property capital improvement, not car-flip profit. Trader reputation starts at 50 and increases modestly when a sale is completed, with a bigger increase for cars without known unrepaired essential faults. Public auctions unlock at 10 flips and operate Saturdays; dealer-only auctions and licensing are future milestones.</p><p>The magazine refreshes every seven days; individual vehicles may remain. Ads can disappear when others buy them.</p></div>`}
function returnTo(c){show(c.source==='magazine'?'magazine':'paper')}
function adjustRep(n){state.reputation=Math.max(0,Math.min(100,(state.reputation??50)+n))}
function purchase(c,price){let cap=garageCapacity();if(state.inventory.length>=cap)return alert('Garage is full. Sell a car first.');if(state.cash<price)return alert('Not enough available cash.');state.cash-=price;c.cost=price;c.expenses=[];remember(c,'DEAL CLOSED','Purchased at '+money(price));c.saleAsking=0;c.buyerOffer=0;c.negStatus='accepted';state.ads=state.ads.filter(x=>x.id!==c.id);state.magazine=state.magazine.filter(x=>x.id!==c.id);state.inventory.push(c);log('purchase',-price,'Bought '+title(c));save();selected=c.id;tab='car';alert(`Purchased ${title(c)} for ${money(price)}. It is now in your garage.`)}
function advance(){state.day++;let payday=(state.day>=6&&(state.day-6)%7===0);if(payday){state.cash+=100;state.sideIncome=(state.sideIncome||0)+100;log('side income',100,'Friday side-job paycheck');}for(let c of [...state.ads,...state.magazine]){if(Math.random()<.055){state.ads=state.ads.filter(x=>x.id!==c.id);state.magazine=state.magazine.filter(x=>x.id!==c.id)}else if(Math.random()<.12)c.ask=round25(c.ask*.96)}while(state.ads.length<22)state.ads.push(newCar('paper'));if(Math.floor(state.day/7)>state.magWeek){state.magWeek=Math.floor(state.day/7);state.magazine=state.magazine.filter(()=>Math.random()<.48);while(state.magazine.length<30)state.magazine.push(newCar('magazine'));page=0}let messages=payday?['Friday payday! $100 from your side job was deposited automatically.']:[];for(let c of state.inventory){if(!c.saleAsking)continue;if(c.buyerOffer)continue;let ratio=c.saleAsking/retail(c),prob=ratio<.9?.78:ratio<1.1?.46:ratio<1.3?.18:.06;if(Math.random()<Math.min(.9,prob*(.8+(state.reputation??50)/250))){c.buyerOffer=round25(Math.min(c.saleAsking,c.saleAsking*rand(79,100)/100));c.buyerName=pick(names.filter(n=>n!==c.name));c.buyerRounds=0;c.buyerHistory=[{day:state.day,who:c.buyerName,message:'I offer '+money(c.buyerOffer)+' for your car.'}];c.buyerMax=round25(Math.max(c.buyerOffer,c.saleAsking*rand(85,110)/100,retail(c)*rand(88,118)/100));messages.push(pick([`${c.buyerName} called about your ${title(c)} and offered ${money(c.buyerOffer)}.`, `A buyer is on the line! ${c.buyerName} put ${money(c.buyerOffer)} on your ${title(c)}.`, `${c.buyerName} wants to talk turkey: ${money(c.buyerOffer)} for your ${title(c)}.`]))}}for(let c of [...state.ads,...state.magazine])if(c.visitDay>=0&&c.negStatus==='walked'&&state.day>c.visitDay&&Math.random()<.1){c.ask=round25(c.ask*.95);c.finalOffer=null;c.negStatus='';messages.push(pick([`${c.name} trimmed the ${title(c)} asking price to ${money(c.ask)}. The classified is still active.`, `Fresh ink in the classifieds: ${c.name}'s ${title(c)} is down to ${money(c.ask)}.`, `${c.name} reduced the ${title(c)} to ${money(c.ask)}. Could be worth another look.`]))}save();alert(messages.length?messages.join(' '):'New day. The marketplace has changed; check listings and any advertised cars.')}
function auctionAction(action){if(state.flips<10)return alert('Public auction unlocks at 10 flips.');ensureAuction();let a=state.auction,day=state.day%7;
if(action.startsWith('auctionbid:')||action.startsWith('auctionclear:')){let clear=action.startsWith('auctionclear:'),i=Number(action.split(':')[1]);if(!Number.isInteger(i)||i<0||i>=a.lots.length||day===1||a.closed||day===0&&i<a.cursor)return alert('This lot is no longer open for bidding.');if(a.lane&&i===a.cursor)return alert('Bidding has started for this lot. Maximum bids are locked until the lot finishes.');const n=clear?0:Number(document.getElementById('auctionbid'+i)?.value||0);if(n<0||!Number.isFinite(n)||n&&n<25)return alert('Enter a valid maximum bid or 0 to clear it.');const next=n?round25(n):0,bids={...a.bids};if(next)bids[i]=next;else delete bids[i];const keys=Object.keys(bids).filter(k=>Number(k)>=a.cursor&&bids[k]>0);const capacity=garageCapacity()-state.inventory.length;const cashNeeded=keys.reduce((sum,k)=>sum+bids[k]+auctionFee(bids[k]),0);if(keys.length>capacity)return alert('ALL GARAGE BAYS COMMITTED! You have '+capacity+' open bay(s), but '+keys.length+' maximum bids would be active. Remove another maximum bid, or wait until you lose a lot to free its slot. Your entered amount was not saved.');if(cashNeeded>state.cash)return alert('TOTAL BID LIMIT REACHED! Maximum commitments including fees would be '+money(cashNeeded)+' but you have '+money(state.cash)+'. Reduce a bid before saving.');a.bids=bids;save();return alert(next?'Maximum bid '+money(next)+' saved for Lot '+(i+1)+'.':'Bid removed for Lot '+(i+1)+'.');}
if(day!==0||a.closed||a.cursor>=a.lots.length)return alert('Auction is not operating now.');
if(action==='auctionnextlot'){a.awaitNext=false;save();return render()}
if(a.awaitNext)return alert('Finish the previous lot by tapping Next Lot.');
if(action==='auctionskip'){if(a.lane)return alert('This lot is already underway. Finish bidding first.');return finishAuctionLot(a,true)}
if(action==='auctionstart'){if(a.lane)return;makeAuctionLane(a);save();return render()}
if(action==='auctionnextbid'){if(!a.lane)return alert('Start this lot first.');a.lane.turn=Math.min(a.lane.turn+1,a.lane.steps.length-1);save();return render()}
if(action==='auctionfinish'){if(!a.lane)return alert('Start this lot first.');return finishAuctionLot(a)}
}
function click(action){if(action.startsWith('auctionbid:')||action==='auctionstart'||action==='auctionnextlot'||action==='auctionnextbid'||action==='auctionfinish'||action==='auctionskip'||action.startsWith('auctionclear:'))return auctionAction(action);if(action==='buildbay'){let cap=garageCapacity(),required=cap===2?5:10,cost=cap===2?500:750;if(cap>=4)return alert('Your home garage already has four spaces.');if(state.flips<required)return alert('Complete '+(required-state.flips)+' more flips before expanding.');if(state.cash<cost)return alert('You need '+money(cost)+' to build this garage bay.');state.cash-=cost;state.propertyInvestment=(state.propertyInvestment||0)+cost;state.garageBays=cap+1;log('property',-cost,'Built home garage bay '+state.garageBays+' (capital improvement)');save();return alert('GARAGE EXPANDED! You invested '+money(cost)+' in a third or fourth home garage bay. Capacity is now '+state.garageBays+'.');}if(action==='license')return alert(state.flips<10?'🔒 Dealer license locked. Complete '+(10-state.flips)+' more flips to become eligible. Licensing and business-premises expenses are a later feature.':'🔓 Eligible for a dealer license! The $500 licensing package and dealer auctions are scheduled for a later release.');if(action==='advance')return advance();if(action==='prev'){page--;return render()}if(action==='next'){page++;return render()}if(action==='back'){let c=findCar(selected);return show(!c?'paper':owns(c)?'garage':c.source==='magazine'?'magazine':'paper')}if(action==='export'){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='motor-mogul-save-day-'+state.day+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1500);return}if(action.startsWith('car:'))return show('car',action.slice(4));let c=findCar(selected);if(!c)return;if(action==='inspectall'){if(owns(c))return alert('Inspect vehicles before buying them.');let unseen=c.repairs.map((_,i)=>i).filter(i=>!c.known.includes(i));if(!unseen.length)return alert('All six systems were already inspected.');let fee=Math.min(25*unseen.length,Math.max(0,100-fees(c)));if(state.cash<fee)return alert('Not enough cash to inspect all remaining systems.');state.cash-=fee;c.inspectionSpent=fees(c)+fee;unseen.forEach(i=>c.known.push(i));log('inspection',-fee,'Complete remaining inspections ('+unseen.length+') — '+title(c));save();return alert('Inspected '+unseen.length+' remaining systems for '+money(fee)+'. Total inspection fees: '+money(fees(c))+'. Open repair estimate: '+money(repairSum(c))+'.');}if(action.startsWith('inspect:')){let i=+action.split(':')[1];if(c.known.includes(i))return;let fee=Math.min(25,Math.max(0,100-fees(c)));if(state.cash<fee)return alert('Not enough cash to pay the mechanic.');state.cash-=fee;c.inspectionSpent=fees(c)+fee;c.known.push(i);log('inspection',-fee,'Inspection '+systems[i]+' — '+title(c));save();return alert(`Inspected ${systems[i]}. Total inspection fees: ${money(fees(c))}. Open estimated repairs: ${money(repairSum(c))}.`)}if(action.startsWith('repair:')){let i=+action.split(':')[1],r=c.repairs[i];if(!owns(c)||!r.fault||r.repaired)return;let cost=r.fault.cost;if(state.cash<cost)return alert('Not enough cash for this repair.');state.cash-=cost;r.repaired=true;if(r.fault.name==='Cooling system needs service')r.health=Math.max(r.health,87);c.expenses.push({name:systems[i]+' — '+r.fault.name,cost});log('repair',-cost,'Repaired '+systems[i]+' — '+title(c));save();return alert(`Repair completed for ${money(cost)}. Condition and resale estimate updated.`)}if(action==='walk'){c.visitDay=state.day;c.negStatus='walked';c.lastMessage='You walked away from the deal.';remember(c,'YOU','Walked away.');save();return returnTo(c)}if(action==='buyask'){remember(c,'YOU','Accepted asking price '+money(c.ask));return purchase(c,c.ask)}if(action==='acceptfinal'){if(c.negStatus!=='final')return;remember(c,'YOU','Accepted final offer '+money(c.finalOffer));return purchase(c,c.finalOffer)}if(action==='offer'){if(c.visitDay===state.day&&(c.negStatus==='walked'||c.negStatus==='final'))return alert('This negotiation is closed for today.');let offer=Number(document.getElementById('offer')?.value);if(!Number.isFinite(offer)||offer<=0)return alert('Enter a valid offer.');if(c.visitDay!==state.day){c.visitDay=state.day;c.offerRounds=0;c.negStatus='open'}c.offerRounds++;remember(c,'YOU','Offered '+money(offer));if(offer<c.ask*.48&&Math.random()<.55){c.negStatus='walked';c.lastMessage='That offer is too far below my asking price. I am done negotiating today.';remember(c,c.name,c.lastMessage);save();return alert(c.name+': '+c.lastMessage)}if(offer>=c.minimum&&Math.random()<(.65+(offer-c.minimum)/Math.max(100,c.ask)*.25)){remember(c,c.name,'Accepted '+money(Math.min(offer,c.ask)));return purchase(c,Math.min(offer,c.ask))}let previous=c.finalOffer||c.ask;c.finalOffer=round25(Math.max(c.minimum,Math.min(previous-25,Math.max(offer+25,(previous+offer)/2))));c.finalOffer=Math.max(c.minimum,c.finalOffer);if(c.finalOffer<=offer){remember(c,c.name,'Accepted '+money(offer));return purchase(c,Math.min(offer,c.ask))}c.lastMessage=c.finalOffer>=previous?`“I'm holding firm at ${money(c.finalOffer)}.”`:`“I can't do ${money(offer)}. I can come down to ${money(c.finalOffer)}.”`;if(c.offerRounds>=3){c.negStatus='final';c.lastMessage=`“This is my final price: ${money(c.finalOffer)}. Take it or leave it.”`}remember(c,c.name,c.lastMessage);save();return alert(c.lastMessage)}if(action==='list'){let price=Number(document.getElementById('asking')?.value);if(!Number.isFinite(price)||price<=0)return alert('Enter a valid asking price.');c.saleAsking=Math.round(price);c.buyerOffer=0;c.buyerRounds=0;save();return alert(`Your ${title(c)} is advertised at ${money(price)}.`)}if(action==='counter'){
 if(!owns(c)||!c.buyerOffer||c.buyerRounds>=3)return alert('No further buyer negotiation is available.');
 let offer=Number(document.getElementById('counter')?.value);
 if(!Number.isFinite(offer)||offer<=0)return alert('Enter a valid counteroffer.');
 c.buyerHistory||=[];c.buyerHistory.push({day:state.day,who:'YOU',message:'Countered at '+money(offer)});c.buyerRounds++;
 let prior=c.buyerOffer;
 if(offer>Math.max(c.buyerMax*1.22,prior*1.35)&&Math.random()<.7){let msg='That is more than I can spend. I am going to look elsewhere.';c.buyerHistory.push({day:state.day,who:c.buyerName,message:msg});c.buyerOffer=0;c.buyerWait=state.day;save();return alert(c.buyerName+': '+msg)}
 if(offer<=c.buyerMax&&(offer<=prior*1.06||Math.random()<.42)){
  c.buyerOffer=Math.round(offer);c.buyerHistory.push({day:state.day,who:c.buyerName,message:'Agreed to '+money(c.buyerOffer)+'.'});
  save();return alert(c.buyerName+' accepted your counteroffer of '+money(c.buyerOffer)+'. You can close the sale.');
 }
 let next=round25(Math.min(c.buyerMax,Math.max(prior+25,prior+(offer-prior)*rand(35,60)/100)));
 if(next>prior)c.buyerOffer=next;
 let msg=next>prior?(c.buyerRounds>=3?'This is my last offer: '+money(c.buyerOffer)+'.':'I can come up to '+money(c.buyerOffer)+'.'):(c.buyerRounds>=3?'My final offer remains '+money(c.buyerOffer)+'.':'My offer stands at '+money(c.buyerOffer)+'.');
 c.buyerHistory.push({day:state.day,who:c.buyerName,message:msg});save();return alert(c.buyerName+': '+msg)
 }
 if(action==='reject'){c.buyerOffer=0;c.buyerWait=state.day;c.buyerRounds=0;save();return alert('Offer rejected. Wait for another buyer.')}if(action==='sell'){if(!owns(c)||!c.buyerOffer)return;let sale=c.buyerOffer,spend=c.expenses.reduce((x,e)=>x+e.cost,0),profit=sale-c.cost-spend-fees(c);state.cash+=sale;state.realized+=profit;state.flips++;adjustRep(c.repairs.some(r=>r.fault&&!r.repaired&&r.fault.severity==='required')?1:2);state.inventory=state.inventory.filter(x=>x.id!==c.id);state.history.unshift({vehicle:title(c),sold:true,buy:c.cost,sale,spend,inspection:fees(c),profit,day:state.day});log('sale',sale,'Sold '+title(c)+'; deal profit '+money(profit));save();selected=null;tab='garage';return alert(`SOLD for ${money(sale)}. Deal profit: ${money(profit)} after purchase, repairs and inspections.`+(state.flips===5?' GARAGE OPPORTUNITY: You can now build a third home garage bay for $500 in Garage.':state.flips===10?' GARAGE OPPORTUNITY: Fourth bay available for $750. Public auction access and dealer license eligibility also unlocked.':''))}}
function render(){if(state.garageMigrationNotice){state.garageMigrationNotice=false;flash='New garage policy: your third bay is unlocked but not built. Visit Garage to decide whether to invest $500. Your savings and trading progress are unchanged.';save();}header();document.getElementById('app').innerHTML=tab==='car'?car():tab==='paper'?paper():tab==='magazine'?magazine():tab==='auction'?auctionPage():tab==='garage'?garage():tab==='guide'?priceGuide():tab==='books'?books():rules()}
document.addEventListener('click',e=>{let el=e.target.closest('[data-action],[data-tab]');if(!el)return;if(el.dataset.tab){show(el.dataset.tab);return}click(el.dataset.action)});render();
})();
</script></body></html>
